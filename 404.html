<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Referto Training</title>
<style>
:root{--bg:#fff;--tx:#14202b;--mu:#5b6873;--ac:#0077cc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--tx:#eef2f5;--mu:#a7b3bd;--ac:#5cb8ff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:520px;padding:32px 20px;text-align:center}
img{width:220px;height:auto;margin-bottom:28px}
h1{font-size:24px;margin:0 0 12px}p{margin:0 0 12px;color:var(--mu)}a{color:var(--ac);font-weight:600}
</style></head>
<body><main>
<picture><source srcset="icons/babacapa-logo-horizontal-reverse.svg" media="(prefers-color-scheme: dark)"><img src="icons/babacapa-logo-horizontal.svg" alt="Babacapa"></picture>
<h1>Referto Training non è più disponibile</h1>
<p>Il referto delle gare si compila da Babacapa, su <a href="https://babacapa.com/">babacapa.com</a>.</p>
<p>Puoi togliere l'icona di Referto Training dalla schermata Home.</p>
</main>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});</script>
</body></html>
